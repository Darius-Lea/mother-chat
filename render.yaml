services:
  - type: web
    name: mother-chat
    runtime: python
    plan: free
    buildCommand: cat models/mother_v008_s11.npz.part00 models/mother_v008_s11.npz.part01 models/mother_v008_s11.npz.part02 models/mother_v008_s11.npz.part03 models/mother_v008_s11.npz.part04 models/mother_v008_s11.npz.part05 > models/mother_v008_s11.npz && sha256sum -c models/mother_v008_s11.npz.sha256 && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MOTHER_MODEL_PATH
        value: models/mother_v008_s11.npz
      - key: MOTHER_TOKENIZER_PATH
        value: models/mother_v006.model
      - key: MOTHER_MAX_TOKENS
        value: "48"
