services:
  - type: web
    name: mother-chat
    runtime: python
    plan: free
    buildCommand: cat models/stageR17_champion.pt.part00 models/stageR17_champion.pt.part01 models/stageR17_champion.pt.part02 > models/stageR17_champion.pt && sha256sum -c models/stageR17_champion.pt.sha256 && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MOTHER_MODEL_PATH
        value: models/stageR17_champion.pt
      - key: MOTHER_TOKENIZER_PATH
        value: models/mother_v006.model
      - key: MOTHER_MAX_TOKENS
        value: "48"
